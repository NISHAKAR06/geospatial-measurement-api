name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geospatial
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system geospatial C-libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run Alembic migrations on PostGIS
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/geospatial
        run: |
          uv run alembic upgrade head

      - name: Run automated test suite (Unit & Integration)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/geospatial
        run: |
          uv run pytest -v
