[project]
name = "geospatial-measurement-api"
version = "0.1.0"
description = "FastAPI service for processing KML and Shapefile data, CRS-aware geospatial measurements, and PostGIS persistence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.142.2",
    "geoalchemy2>=0.16.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.0",
    "pyproj>=3.8.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.32",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]
